services:
  - type: web
    name: vera-message-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    healthCheckPath: /v1/healthz

    # IMPORTANT: on the free plan Render spins the service down after ~15 min
    # of no inbound traffic. That drops all in-memory context and makes the
    # first healthz probe time out, which the harness counts as a failure
    # (3 in a row = disqualified). Use "starter" for the judged run, or keep
    # "free" and set VERA_KEEPALIVE_URL below to self-ping.
    plan: starter

    envVars:
      - key: VERA_SNAPSHOT
        value: /tmp/vera_snapshot.json
      - key: VERA_TEAM_NAME
        value: Aakanksha Singh
      - key: VERA_TEAM_MEMBERS
        value: Aakanksha Singh
      - key: VERA_CONTACT
        value: aakanksha.singh0205@gmail.com
      # set this to the real submission timestamp when you submit
      - key: VERA_SUBMITTED_AT
        value: "2026-08-24T00:00:00Z"
      # only needed on the free plan; set to the service's own public URL
      # - key: VERA_KEEPALIVE_URL
      #   value: https://vera-message-engine.onrender.com
