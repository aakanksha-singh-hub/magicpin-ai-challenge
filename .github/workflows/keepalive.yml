# Uptime alarm for the bot. NOT the keepalive -- see below.
#
# The job FAILS when the bot does not answer, so a dead endpoint emails you
# instead of sitting quietly dead through the judging window. That is this
# file's actual job.
#
# It is deliberately not load-bearing for uptime. GitHub throttles scheduled
# workflows on shared runners: this cron asks for every 10 minutes and in
# practice managed one scheduled run in nine hours. Sub-hourly GitHub cron is
# best-effort monitoring, never a heartbeat something depends on.
#
# What actually keeps the instance warm is the in-process self-ping in app.py,
# armed by VERA_KEEPALIVE_URL. Render's free tier spins a service down after
# ~15 minutes without inbound traffic, and the bot holds pushed context in
# memory, so a spin-down between the judge's push and its tick loses everything.

name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # override in Settings → Secrets and variables → Actions → Variables
      BOT_URL: ${{ vars.BOT_URL || 'https://magicpin-ai-challenge-ozhb.onrender.com' }}
    steps:
      - name: Ping /v1/healthz
        run: |
          set -uo pipefail
          # a cold instance can take ~50s to boot, so allow three tries before
          # calling it down -- and keep the total well inside timeout-minutes
          for attempt in 1 2 3; do
            code=$(curl -sS -m 60 -o body.json -w '%{http_code}' \
                   "$BOT_URL/v1/healthz" || echo 000)
            if [ "$code" = "200" ]; then
              echo "OK on attempt $attempt"
              cat body.json; echo
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            [ "$attempt" -lt 3 ] && sleep 20
          done
          echo "::error::$BOT_URL/v1/healthz did not return 200 after 3 attempts"
          exit 1
